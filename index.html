<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- tailwind and daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- external css file -->
     <link rel="stylesheet" href="style.css">
</head>
<body class="bg-base-200 min-h-screen flex justify-center items-center ">
    
    
        <section class="max-w-xl  bg-white shadow-md py-5 px-10  ">
        <div class="text-center pt-[20px]">
            <img class="mx-auto" src="assets/github-logo.png" alt="">
            <h3 class="font-semibold text-[24px] text-[#1F2937] mt-[25px]">GitHub Issues Tracker</h3>
            <p class="text-[#64748B]">Sign in to manage your issues</p>
        </div>
        <div>
            <fieldset>
                
                <div class="mt-10">
                    <label for="username-input" class="font-bold text-[#1F2937]">Username</label>
                    <br>
                    <input id="username-input" class="placeholder:text-[#64748B] w-full py-2 px-2 rounded-md  outline-gray-300 my-1" type="text" placeholder="Enter Username">
                    <p class="text-[14px] text-[#4A00FF]">Default: admin</p>
                </div>

                <div class="my-5">
                    <label class="font-bold text-[#1F2937]" for="password-input">Password</label>
                    <br>
                    <input id="password-input" class="placeholder:text-[#64748B] w-full py-2 px-2 rounded-md  outline-gray-300 my-1" type="text" placeholder="Enter Password">
                    <p class="text-[14px] text-[#4A00FF]">Default: admin123</p>
                </div>

                <button id="login-btn" class="btn btn-primary w-full py-6 rounded-md ">Sign In</button>
            </fieldset>
        </div>
        
            <div class="divider my-7">OR</div>
            <div class="text-center ">
                <p class="text-[14px] text-[#64748B]">Demo Credentials:</p>
                <div class="bg-base-200 py-5 mt-3">
                    <p class="text-[#64748B]"><span class="font-semibold text-[#1F2937]">Username:</span> admin</p>
                    <p class="text-[#64748B]"><span class="font-semibold text-[#1F2937]">Password:</span>admin123</p>

                </div>
            </div>
        
    </section>
    


    <script src="script/login.js"></script>

</body>
</html>
