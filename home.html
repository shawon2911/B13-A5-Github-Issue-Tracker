<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- tailwind and daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- external css file -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-base-200 min-h-screen">
    
    <!-- navbar start -->
     <header>
        <div class="bg-white py-4 px-20 flex justify-between items-center shadow-sm">
            <div class="navbar-logo flex justify-center items-center space-x-1">
                <img class="w-8" src="assets/github-logo.png" alt="">
                <h3 class="font-semibold text-[24px] text-[#1F2937]">GitHub Issues Tracker</h3>
            </div>

            <div class="navbar-search-bar">
                <div class="join">
                    <div>
                        <label class="input validator join-item">
                        
                        <input type="text" placeholder="Search issues..." required />
                        </label>
                        
                    </div>
                    <button class="btn btn-primary join-item">Search</button>
                </div>
            </div>
        </div>
     </header>
    <!-- navbar end -->



    <!-- main part -->
        <main>
            <!-- 3 tabs -->
         <section class="bg-white shadow-sm rounded-md max-w-9/12 mx-auto mt-15 py-5 px-6">
            <div class="buttons space-x-2">
                <button onclick="toggleStyle('all-btn')"  id="all-btn" class="btn btn-primary">All</button>
                <button onclick="toggleStyle('open-btn')" id="open-btn" class="btn text-[#64748B]">Open</button>
                <button onclick="toggleStyle('close-btn')" id="close-btn" class="btn text-[#64748B] ">Closed</button>
            </div>
         </section>
        <!-- 3 tabs -->

        <!-- issues count -->
         <section class="bg-white shadow-md  rounded-t-md max-w-9/12 mx-auto mt-5 py-5 px-6">
            <div class="flex justify-between items-center">
                <div class="flex  items-center space-x-2">
                    <img src="assets/Aperture.png" alt="">
                    <div>
                        <p class="font-semibold text-[20px] text-[#1F2937]"><span >50 </span>Issues</p>
                        <p class="text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <div class="rounded-full bg-green-500 w-3 h-3"></div>
                        <p class="font-medium text-[#1F2937]">Open</p>

                        <div class="rounded-full bg-purple-500 w-3 h-3 ml-2"></div>
                        <p class="font-medium text-[#1F2937]">Closed</p>
                    </div>
                </div>
            </div>
         </section>
        <!-- issues count -->



        <!-- card container -->
         <section id="card-container" class="bg-base-200 shadow-sm  max-w-9/12 mx-auto  py-5 px-6 grid grid-cols-4 gap-5">
            




             
         </section>
        <!-- card container -->
        </main>
    <!-- main part -->

        
    


    
    <script src="script/index.js"></script>

</body>
</html>
